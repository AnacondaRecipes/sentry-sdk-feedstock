{% set name = "sentry-sdk" %}
{% set version = "2.66.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/get{{ name.split('-')[0] }}/{{ name.split('-')[0] }}-python/archive/refs/tags/{{ version }}.tar.gz
  sha256: 5775b1bf806472c6c6fcd1d20d6b119cbbf0c60af96d8a954b73f53837adc52c

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  skip: true  # [py<36]

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - urllib3 >=1.26.11
    - certifi
  run_constrained:
    - aiohttp >=3.5
    - anthropic >=0.16
    - arq >=0.23
    - asyncpg >=0.23
    - apache-beam >=2.12
    - bottle >=0.12.13
    - celery >=3
    - celery-redbeat >=2
    - chalice >=1.16.0
    - clickhouse-driver >=0.2.0
    - django >=1.8
    - falcon >=1.4
    - fastapi >=0.79.0
    - flask >=0.11
    - blinker >=1.1
    - grpcio >=1.21.1
    - protobuf >=3.8.0
    - httpcore ==1.*
    - httpx >=0.16.0
    - huey >=2
    - huggingface_hub >=0.22
    - langchain >=0.0.210
    - langgraph >=0.6.6
    - launchdarkly-server-sdk >=9.8.0
    - litellm >=1.77.5,!=1.82.7,!=1.82.8
    - litestar >=2.0.0  # extra:litestar
    - mcp >=1.15.0
    - loguru >=0.5
    - openai >=1.0.0
    - tiktoken >=0.3.0
    - openfeature-sdk >=0.7.1
    - opentelemetry-distro >=0.35b0
    - pydantic-ai >=1.0.0
    - pymongo >=3.1
    - pyspark >=2.4.4
    - quart >=0.16.1
    - blinker >=1.1  # extra:blinker
    - rq >=0.6
    - sanic >=0.8
    - sqlalchemy >=1.2
    - starlette >=0.19.1
    - starlite >=1.48
    - statsig >=0.55.3
    - tornado >=6
    - UnleashClient >=6.0.1
    - google-genai >=1.29.0


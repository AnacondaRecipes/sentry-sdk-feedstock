# E        +  where '5ee37a29e25a4b69a49a195dbf49768e' = get_profiler_id()
{% set deselect_tests = deselect_tests + " --deselect=tests/tracing/test_span_streaming.py::test_profile_stops_when_segment_ends" %}  # [osx]

test:
  source_files:
    - tests
  imports:
    - sentry_sdk
  commands:
    - pip check
    - python -m pytest -vv tests {{ ignore_tests }} {{ deselect_tests }}
  requires:
    - pip
    - pytest >=6.0.0
    - brotli-python
    - pytest-localserver
    - jsonschema
    - pytest-asyncio
    - executing
    - httpcore
    - httpx
    - h2

about:
  home: https://github.com/getsentry/sentry-python
  license: BSD-2-Clause
